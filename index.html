<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigma Tracking – Salomon Husney</title>
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0; padding:0; box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#e9eaee; color:#111;
  display:flex; justify-content:center; align-items:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
.card{
  width:100%; max-width:430px; height:100%; max-height:900px;
  background:#fff; display:flex; flex-direction:column; overflow:hidden;
}
@media (min-width:481px){
  body{padding:24px}
  .card{height:860px; max-height:calc(100vh - 48px); border-radius:44px; border:10px solid #1f2937; box-shadow:0 24px 50px rgba(0,0,0,.25)}
}

/* Logo */
.header{flex:none; padding:14px 20px 8px; text-align:center}
.header img{width:min(62vw,230px); height:auto; display:block; margin:0 auto}

/* Mapa animado */
.map{position:relative; flex:1 1 auto; min-height:170px; overflow:hidden}
.map svg{position:absolute; inset:0; width:100%; height:100%}
.map::after{ /* desvanece el mapa hacia los botones */
  content:""; position:absolute; left:0; right:0; bottom:0; height:26%;
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 95%); pointer-events:none}
.live{position:absolute; top:10px; right:12px; z-index:2; display:flex; align-items:center; gap:6px;
  background:rgba(17,17,17,.85); color:#fff; font-size:10px; font-weight:800; letter-spacing:.06em;
  padding:5px 10px; border-radius:20px}
.live i{width:7px; height:7px; border-radius:50%; background:#22c55e; animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.route-draw{stroke-dasharray:620; stroke-dashoffset:620; animation:draw 6s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:620}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0; opacity:0}}

/* Botones redondos */
.buttons{
  flex:none; position:relative; z-index:3; margin-top:-8%;
  display:grid; grid-template-columns:repeat(2,auto); justify-content:center;
  gap:clamp(10px,2.2dvh,22px) clamp(18px,7vw,36px); padding:0 16px 10px;
}
.btn{
  --s:clamp(104px,min(36vw,17dvh),150px);
  width:var(--s); height:var(--s); border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#2a2a2a 0%,#0b0b0b 70%);
  border:calc(var(--s)*.05) solid #d0111b;
  box-shadow:0 0 0 3px #3a0a0c, 0 10px 20px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.08);
  color:#fff; text-decoration:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  font:800 calc(var(--s)*.105)/1.05 "Montserrat",system-ui,sans-serif; letter-spacing:.02em; text-align:center;
  transition:transform .15s ease, box-shadow .15s ease;
  animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both;
}
.btn svg{width:calc(var(--s)*.3); height:calc(var(--s)*.3); flex:none}
.btn small{display:block; font-size:.62em; font-weight:700; opacity:.9; margin-top:2px}
.btn:active{transform:scale(.94)}
.btn:hover{box-shadow:0 0 0 3px #3a0a0c, 0 0 0 9px rgba(208,17,27,.18), 0 10px 20px rgba(0,0,0,.28)}
.btn:nth-child(2){animation-delay:.07s} .btn:nth-child(3){animation-delay:.14s} .btn:nth-child(4){animation-delay:.21s}
@keyframes pop{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
a:focus-visible,button:focus-visible{outline:3px solid #d0111b; outline-offset:4px}

.footer{flex:none; text-align:center; font-size:13px; font-weight:600; color:#222; padding:6px 12px 14px}

@media (prefers-reduced-motion:reduce){ .btn,.route-draw,.live i{animation:none} .route-draw{stroke-dashoffset:0} }
</style>
</head>
